<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed background: launchers apply their own corner mask -->
  <rect width="512" height="512" fill="#0D1B2A"/>
  <!-- Ball sized for the maskable safe zone (r < 204) -->
  <circle cx="256" cy="256" r="192" fill="#E8DE54"/>
  <circle cx="256" cy="256" r="192" fill="none" stroke="#C9BF3F" stroke-width="6"/>
  <!-- Highlight -->
  <ellipse cx="208" cy="172" rx="64" ry="46" fill="#F4ED8E" opacity="0.5"/>
  <!-- Seams: each bulges away from center, like ( ) -->
  <path d="M 168 100 Q 48 256 168 412" fill="none" stroke="#D14B3C" stroke-width="15" stroke-linecap="round"/>
  <path d="M 344 100 Q 464 256 344 412" fill="none" stroke="#D14B3C" stroke-width="15" stroke-linecap="round"/>
  <!-- Stitch ticks crossing each seam -->
  <g stroke="#D14B3C" stroke-width="9" stroke-linecap="round">
    <line x1="126" y1="141" x2="149" y2="153"/>
    <line x1="103" y1="196" x2="128" y2="203"/>
    <line x1="94"  y1="256" x2="122" y2="256"/>
    <line x1="103" y1="316" x2="128" y2="309"/>
    <line x1="126" y1="371" x2="149" y2="359"/>
    <line x1="386" y1="141" x2="363" y2="153"/>
    <line x1="409" y1="196" x2="384" y2="203"/>
    <line x1="418" y1="256" x2="390" y2="256"/>
    <line x1="409" y1="316" x2="384" y2="309"/>
    <line x1="386" y1="371" x2="363" y2="359"/>
  </g>
</svg>
